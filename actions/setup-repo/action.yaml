---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo
description: Sets up the repository's toolchain with Mise

inputs:
  cache:
    description: Whether or not to use caches
    default: "true"

  cache-key:
    description: Shared cache key to use
    default: default

  install-args:
    description: Arguments to pass to the underlying Mise action
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install: true
        install_args: ${{ inputs.install-args }}
        cache: ${{ inputs.cache }}
        cache_key_prefix: ${{ inputs.cache-key }}-mise

    - id: toolchains
      if: ${{ inputs.cache == 'true' }}
      name: Detect language toolchains
      shell: bash
      run: |
        {
          echo "rust=$(mise ls --current --installed --json rust | jq -r length)"
          echo "pnpm=$(mise ls --current --installed --json pnpm | jq -r length)"
          echo "aube=$(mise ls --current --installed --json aube | jq -r length)"
          echo "dotnet=$(mise ls --current --installed --json dotnet | jq -r length)"
          echo "terraform=$(mise ls --current --installed --json terraform | jq -r length)"
        } >> "${GITHUB_OUTPUT}"

    - name: Rust cache
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.rust > 0 }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: ${{ inputs.cache-key }}-rust

    - name: Determine .NET configuration
      id: dotnet-config
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.dotnet > 0 }}
      shell: bash
      run: |
        {
          echo "dotnet-version=$(dotnet --version)"
        } >> "${GITHUB_OUTPUT}"

    - name: Setup .NET cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: "${{ inputs.cache == 'true' && steps.toolchains.outputs.dotnet > 0 }}"
      with:
        path: ~/.nuget/packages
        key: ${{ inputs.cache-key }}-nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-config.outputs.dotnet-version }}-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ inputs.cache-key }}-nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-config.outputs.dotnet-version }}-
          ${{ inputs.cache-key }}-nuget-${{ runner.os }}-${{ runner.arch }}-
          ${{ inputs.cache-key }}-nuget-${{ runner.os }}-
          ${{ inputs.cache-key }}-nuget-

    - name: Determine PNPM configuration
      id: pnpm-config
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.pnpm > 0 }}
      shell: bash
      run: |
        {
          echo "path=$(pnpm store path --silent)"
          echo "pnpm-version=$(pnpm --version)"
          echo "node-version=$(node --version)"
        } >> "${GITHUB_OUTPUT}"

    - name: Set up PNPM cache
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.pnpm > 0 }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-config.outputs.path }}
        key: ${{ inputs.cache-key }}-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-config.outputs.pnpm-version }}-${{ steps.pnpm-config.outputs.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ inputs.cache-key }}-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-config.outputs.pnpm-version }}-${{ steps.pnpm-config.outputs.node-version }}-
          ${{ inputs.cache-key }}-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-config.outputs.pnpm-version }}-
          ${{ inputs.cache-key }}-pnpm-${{ runner.os }}-${{ runner.arch }}-
          ${{ inputs.cache-key }}-pnpm-${{ runner.os }}-
          ${{ inputs.cache-key }}-pnpm-

    - name: Determine aube configuration
      id: aube-config
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.aube > 0 }}
      shell: bash
      run: |
        {
          echo "path=$(aube store path --silent)"
          echo "aube-version=$(aube -V --silent | awk '{ print $1 }')"
          echo "node-version=$(node --version)"
        } >> "${GITHUB_OUTPUT}"

    - name: Set up aube cache
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.aube > 0 }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.aube-config.outputs.path }}
        key: ${{ inputs.cache-key }}-aube-${{ runner.os }}-${{ runner.arch }}-${{ steps.aube-config.outputs.aube-version }}-${{ steps.aube-config.outputs.node-version }}-${{ hashFiles('**/aube-lock.yaml', '**/pnpm-lock.yaml', '**/bun.lock', '**/yarn.lock', '**/npm-shrinkwrap.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ inputs.cache-key }}-aube-${{ runner.os }}-${{ runner.arch }}-${{ steps.aube-config.outputs.aube-version }}-${{ steps.aube-config.outputs.node-version }}-
          ${{ inputs.cache-key }}-aube-${{ runner.os }}-${{ runner.arch }}-${{ steps.aube-config.outputs.aube-version }}-
          ${{ inputs.cache-key }}-aube-${{ runner.os }}-${{ runner.arch }}-
          ${{ inputs.cache-key }}-aube-${{ runner.os }}-
          ${{ inputs.cache-key }}-aube-

    - name: Configure Terraform plugin cache
      id: terraform-setup
      shell: bash
      if: "${{ inputs.cache == 'true' && steps.toolchains.outputs.terraform > 0 }}"
      run: |
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "terraform-version=$(terraform --version -json | jq -r .terraform_version)" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: "${{ inputs.cache == 'true' && steps.toolchains.outputs.terraform > 0 }}"
      with:
        path: "~/.terraform.d/plugin-cache"
        key: ${{ inputs.cache-key }}-terraform-${{ runner.os }}-${{ runner.arch }}-${{ steps.terraform-setup.outputs.terraform-version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          ${{ inputs.cache-key }}-terraform-${{ runner.os }}-${{ runner.arch }}-${{ steps.terraform-setup.outputs.terraform-version }}-
          ${{ inputs.cache-key }}-terraform-${{ runner.os }}-${{ runner.arch }}-
          ${{ inputs.cache-key }}-terraform-${{ runner.os }}-
          ${{ inputs.cache-key }}-terraform-
