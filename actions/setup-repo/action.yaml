---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup repo
description: Sets up the repository's toolchain with Mise

inputs:
  cache:
    description: Whether or not to use caches
    default: "true"

  cache-key:
    description: Shared cache key to use
    default: default

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        install: true
        cache: ${{ inputs.cache }}
        cache_key_prefix: ${{ inputs.cache-key }}-mise

    - id: toolchains
      if: ${{ inputs.cache == 'true' }}
      name: Detect language toolchains
      shell: bash
      run: |
        {
          echo "rust=$(mise ls --current --json rust | jq -r length)"
        } >> "${GITHUB_OUTPUT}"

    - name: Rust cache
      if: ${{ inputs.cache == 'true' && steps.toolchains.outputs.rust > 0 }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: ${{ inputs.cache-key }}-rust
