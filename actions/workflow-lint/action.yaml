---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Workflow Lint
description: Lint workflows and action definitions with actionlint and zizmor

inputs:
  jactionlint-version:
    description: Version of jactionlint to run
    default: latest

runs:
  using: composite
  steps:
    - name: Setup Mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        install: false

    - name: Run jactionlint
      shell: bash
      env:
        JACTIONLINT_VERSION: ${{ inputs.jactionlint-version }}
      run: |
        mise exec jactionlint@"${JACTIONLINT_VERSION}" -- jactionlint --format github
