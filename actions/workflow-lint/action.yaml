---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Workflow Lint
description: Lint workflows and action definitions jactionlint
runs:
  using: composite
  steps:
    - name: Setup repo
      uses: $/actions/mise-action
      with:
        install-args: jactionlint shellcheck
    - name: Run jactionlint
      shell: bash
      run: |
        jactionlint --format github
